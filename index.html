<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Router Multi-Page App</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/react-router-dom@6.28.0/dist/umd/react-router-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    nav {
      background: #20232a;
      padding: 18px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 17px;
      font-weight: bold;
    }

    nav a:hover {
      color: #61dafb;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #2563eb;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .card {
      padding: 20px;
      background: #f1f5f9;
      border-radius: 10px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      color: #666;
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    const {
      HashRouter,
      Routes,
      Route,
      Link
    } = ReactRouterDOM;

    function Navigation() {
      return (
        <nav>
          <Link to="/">Home</Link>
          <Link to="/about">About</Link>
          <Link to="/services">Services</Link>
          <Link to="/contact">Contact</Link>
        </nav>
      );
    }

    function Home() {
      return (
        <div className="container">
          <h1>Welcome to My React App</h1>
          <p>
            This is the Home page of my React Router Multi-Page App.
          </p>

          <div className="card-grid">
            <div className="card">
              <h2>React</h2>
              <p>Built using React.</p>
            </div>

            <div className="card">
              <h2>Router</h2>
              <p>Navigation is handled using React Router.</p>
            </div>

            <div className="card">
              <h2>Responsive</h2>
              <p>The application works on different screen sizes.</p>
            </div>
          </div>
        </div>
      );
    }

    function About() {
      return (
        <div className="container">
          <h1>About Page</h1>
          <p>
            This project demonstrates multi-page navigation using
            React Router.
          </p>
          <p>
            It contains multiple routes such as Home, About,
            Services and Contact.
          </p>
        </div>
      );
    }

    function Services() {
      return (
        <div className="container">
          <h1>Services Page</h1>

          <div className="card-grid">
            <div className="card">
              <h2>Web Development</h2>
              <p>Modern and responsive websites.</p>
            </div>

            <div className="card">
              <h2>React Development</h2>
              <p>Interactive applications using React.</p>
            </div>

            <div className="card">
              <h2>UI Design</h2>
              <p>Clean and user-friendly interfaces.</p>
            </div>
          </div>
        </div>
      );
    }

    function Contact() {
      return (
        <div className="container">
          <h1>Contact Page</h1>
          <p>
            You can contact us for more information.
          </p>

          <p>
            Email: example@email.com
          </p>

          <p>
            Phone: +91 9876543210
          </p>
        </div>
      );
    }

    function App() {
      return (
        <>
          <Navigation />

          <Routes>
            <Route path="/" element={<Home />} />
            <Route path="/about" element={<About />} />
            <Route path="/services" element={<Services />} />
            <Route path="/contact" element={<Contact />} />
          </Routes>

          <footer>
            React Router Multi-Page App © 2026
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(
      <HashRouter>
        <App />
      </HashRouter>
    );

  </script>

</body>
</html>
