<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>React Router Multi-Page App</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

  <!-- React DOM -->
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- React Router -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-router-dom/6.28.0/react-router-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    nav {
      background: #20232a;
      padding: 20px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 18px;
      font-weight: bold;
      font-size: 17px;
    }

    nav a:hover {
      color: #61dafb;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 35px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #2563eb;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: #f1f5f9;
      padding: 20px;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    const {
      HashRouter,
      Routes,
      Route,
      Link
    } = ReactRouterDOM;


    function Navbar() {
      return (
        <nav>
          <Link to="/">Home</Link>
          <Link to="/about">About</Link>
          <Link to="/services">Services</Link>
          <Link to="/contact">Contact</Link>
        </nav>
      );
    }


    function Home() {
      return (
        <div className="container">

          <h1>React Router Multi-Page App</h1>

          <p>
            Welcome to my React Router project.
          </p>

          <p>
            This application demonstrates navigation between
            multiple pages using React Router.
          </p>

          <div className="cards">

            <div className="card">
              <h2>React</h2>
              <p>Built using React.</p>
            </div>

            <div className="card">
              <h2>Routing</h2>
              <p>Navigation using React Router.</p>
            </div>

            <div className="card">
              <h2>Responsive</h2>
              <p>Works on different screen sizes.</p>
            </div>

          </div>

        </div>
      );
    }


    function About() {
      return (
        <div className="container">

          <h1>About Page</h1>

          <p>
            This is the About page of the application.
          </p>

          <p>
            The project demonstrates how React Router
            can be used to create multiple pages.
          </p>

        </div>
      );
    }


    function Services() {
      return (
        <div className="container">

          <h1>Services Page</h1>

          <div className="cards">

            <div className="card">
              <h2>Web Development</h2>
              <p>Modern responsive websites.</p>
            </div>

            <div className="card">
              <h2>React Development</h2>
              <p>Interactive React applications.</p>
            </div>

            <div className="card">
              <h2>UI Design</h2>
              <p>Clean and user-friendly interfaces.</p>
            </div>

          </div>

        </div>
      );
    }


    function Contact() {
      return (
        <div className="container">

          <h1>Contact Page</h1>

          <p>
            Email: example@email.com
          </p>

          <p>
            Phone: +91 9876543210
          </p>

        </div>
      );
    }


    function App() {
      return (
        <HashRouter>

          <Navbar />

          <Routes>

            <Route
              path="/"
              element={<Home />}
            />

            <Route
              path="/about"
              element={<About />}
            />

            <Route
              path="/services"
              element={<Services />}
            />

            <Route
              path="/contact"
              element={<Contact />}
            />

          </Routes>

          <footer>
            React Router Multi-Page App © 2026
          </footer>

        </HashRouter>
      );
    }


    ReactDOM
      .createRoot(document.getElementById("root"))
      .render(<App />);

  </script>

</body>
</html>
