<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Router Multi-Page App</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/react-router-dom@6.28.0/dist/umd/react-router-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    nav {
      background: #20232a;
      padding: 20px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-size: 18px;
      font-weight: bold;
    }

    nav a:hover {
      color: #61dafb;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 40px;
      background: white;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      color: #2563eb;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      margin-top: 50px;
      background: #20232a;
      color: white;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    const {
      HashRouter,
      Routes,
      Route,
      Link
    } = ReactRouterDOM;

    function Navigation() {
      return (
        <nav>
          <Link to="/">Home</Link>
          <Link to="/about">About</Link>
          <Link to="/contact">Contact</Link>
        </nav>
      );
    }

    function Home() {
      return (
        <div className="container">
          <h1>Welcome to React Router App</h1>

          <p>
            This is the Home page.
          </p>

          <p>
            This project demonstrates navigation between
            multiple pages using React Router.
          </p>

          <Link className="button" to="/about">
            Go to About
          </Link>
        </div>
      );
    }

    function About() {
      return (
        <div className="container">
          <h1>About Us</h1>

          <p>
            This page is created using React and React Router.
          </p>

          <p>
            React Router allows users to navigate between
            different pages without reloading the application.
          </p>

          <Link className="button" to="/contact">
            Go to Contact
          </Link>
        </div>
      );
    }

    function Contact() {
      return (
        <div className="container">
          <h1>Contact Us</h1>

          <p>Email: example@gmail.com</p>

          <p>Phone: +91 9876543210</p>

          <Link className="button" to="/">
            Back to Home
          </Link>
        </div>
      );
    }

    function App() {
      return (
        <HashRouter>

          <Navigation />

          <Routes>

            <Route path="/" element={<Home />} />

            <Route path="/about" element={<About />} />

            <Route path="/contact" element={<Contact />} />

          </Routes>

          <footer>
            React Router Multi-Page App © 2026
          </footer>

        </HashRouter>
      );
    }

    ReactDOM
      .createRoot(document.getElementById("root"))
      .render(<App />);

  </script>

</body>
</html>
