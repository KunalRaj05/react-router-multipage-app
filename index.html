<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>React Router Multi-Page App</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- React Router -->
  <script src="https://unpkg.com/react-router-dom@6.28.0/dist/umd/react-router-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    nav {
      background: #20232a;
      padding: 18px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 18px;
      font-weight: bold;
    }

    nav a:hover {
      color: #61dafb;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-top: 25px;
    }

    h1 {
      color: #2563eb;
    }

    h2 {
      color: #333;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    const {
      HashRouter,
      Routes,
      Route,
      Link
    } = ReactRouterDOM;


    // Home Page
    function Home() {
      return (
        <div className="container">
          <div className="card">
            <h1>Welcome to Home Page</h1>
            <p>
              This is the Home page of our React Router Multi-Page App.
            </p>
          </div>
        </div>
      );
    }


    // About Page
    function About() {
      return (
        <div className="container">
          <div className="card">
            <h1>About Us</h1>
            <p>
              This page demonstrates navigation using React Router.
            </p>
          </div>
        </div>
      );
    }


    // Services Page
    function Services() {
      return (
        <div className="container">
          <div className="card">
            <h1>Our Services</h1>

            <p>Web Development</p>
            <p>React Development</p>
            <p>Frontend Development</p>
          </div>
        </div>
      );
    }


    // Contact Page
    function Contact() {
      return (
        <div className="container">
          <div className="card">
            <h1>Contact Us</h1>

            <p>Email: example@gmail.com</p>
            <p>Phone: +91 9876543210</p>
          </div>
        </div>
      );
    }


    // Navigation Bar
    function Navigation() {
      return (
        <nav>

          <Link to="/">Home</Link>

          <Link to="/about">About</Link>

          <Link to="/services">Services</Link>

          <Link to="/contact">Contact</Link>

        </nav>
      );
    }


    // Main App
    function App() {
      return (
        <HashRouter>

          <Navigation />

          <Routes>

            <Route
              path="/"
              element={<Home />}
            />

            <Route
              path="/about"
              element={<About />}
            />

            <Route
              path="/services"
              element={<Services />}
            />

            <Route
              path="/contact"
              element={<Contact />}
            />

          </Routes>

        </HashRouter>
      );
    }


    // Render App
    ReactDOM
      .createRoot(document.getElementById("root"))
      .render(<App />);

  </script>

</body>
</html>
